name: Weekly Court Booking Bot

on:
  schedule:
    # 0 5 means 5:00 AM UTC (which is exactly 12:00 AM Midnight Central Daylight Time). 
    # The '3' at the end means it ONLY runs on Wednesdays.
    - cron: '0 5 * * 3'
  workflow_dispatch:

jobs:
  book-court:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run reservation script
        env:
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python auto_login.py

      - name: Upload Failure Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: booking-failure-screenshot
          path: booking_failure.png
